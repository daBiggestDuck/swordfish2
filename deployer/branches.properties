# Who owns each branch and what goes on it. Shown on the deployer dashboard.
# Format:  branch = owner | what goes on it
# Branch names are matched without caring about upper/lower case.
main   = Person 6 (merges only) | The working site we demo. Nobody codes directly on it
data   = Person 1 | Mission, site and pet data; sources
map    = Person 2 | Lunar map, filters, site picker
engine = Aku | Game rules and meter balance
pets   = Person 4 | Pet art, moods, animations
story  = Person 5 | Mission pop-ups and Pet Passport
ui     = Person 6 | Layout, styling, intro screen, demo
deployer = Aku | This dashboard: builds and shows every branch
